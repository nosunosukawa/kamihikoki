<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紙飛行機ラボ｜ブラウザ版は公開を終えました</title>
<meta name="description" content="紙飛行機ラボのブラウザ版は、公開を終えました。iPhone アプリを準備しています。">
<meta name="theme-color" content="#16241f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="紙飛行機ラボ">
<meta property="og:description" content="ブラウザ版は公開を終えました。iPhone アプリを準備しています。">
<meta property="og:url" content="https://nosunosukawa.github.io/kamihikoki/">
<meta property="og:image" content="https://nosunosukawa.github.io/kamihikoki/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--mat:#1F6B52;--grid:#2E8266;--paper:#FBFAF5;--ink:#16241f;--red:#E5482D;
  --hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.8;
  background:var(--mat);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main{width:min(100%,440px);background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:30px 26px 26px;box-shadow:6px 6px 0 rgba(22,36,31,.35);position:relative}
/* 紙の角を1つ折る：このゲームの最初の一手 */
main::after{content:"";position:absolute;top:-1.5px;right:-1.5px;width:44px;height:44px;
  background:linear-gradient(225deg,var(--mat) 50%,#e4e0d2 50%);border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
svg{display:block;width:92px;height:auto;margin-bottom:14px}
h1{font-family:var(--hand);font-size:26px;font-weight:600;letter-spacing:.06em;line-height:1.4}
p{margin-top:12px;font-size:15px}
p.lead{font-weight:700;font-size:16px}
small{display:block;margin-top:20px;padding-top:12px;border-top:1.5px dashed #c9d6cf;font-size:12.5px;color:#5b6b65}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 92 46" aria-hidden="true"><path d="M2 20 90 4 34 30z" fill="#fff" stroke="#16241f" stroke-width="1.5" stroke-linejoin="round"/><path d="M34 30 40 44 50 27z" fill="#e4e0d2" stroke="#16241f" stroke-width="1.5" stroke-linejoin="round"/><path d="M90 4 34 30" stroke="#E5482D" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
  <h1>紙飛行機ラボ</h1>
  <p class="lead">ブラウザ版は、公開を終えました。</p>
  <p>遊んでくださって、ありがとうございました。いまは iPhone アプリを準備しています。</p>
  <small><a href="support.html">サポート</a> ・ <a href="privacy.html">プライバシーポリシー</a> ・ <a href="support.en.html">English</a></small></main>
<script>
/* 前に開いた人の端末に残っている、オフライン用の保存（ゲーム本体）を消す */
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
</script>
</body>
</html>
